<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTU Attendance System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>MTU Student Attendance System</h2>
        <p><em>Course: Software Engineering</em></p>
        <hr>
        <form id="attendance-form">
            <div class="form-group">
                <label for="student-select">Select Student:</label>
                <select id="student-select">
                    <option value="1">Alice Smith</option>
                    <option value="2">Bob Jones</option>
                </select>
            </div>

            <div class="form-group">
                <label for="status-select">Attendance Status:</label>
                <select id="status-select">
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>

            <button type="submit" id="record-btn">Record Attendance</button>
        </form>

        <h3 style="margin-top: 30px;">Attendance Records Log</h3>
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Course</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="attendance-table-body"></tbody>
        </table>
    </div>

    <script src="js/models.js"></script>
    <script src="js/factories.js"></script>
    <script src="js/facade.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
